apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  generators:
  - git:
      repoURL: https://github.com/LilithPandragon/dritte-einheit
      revision: HEAD
      directories:
      - path: my-new-gitops-repo/appset-apps/*
  template:
    metadata:
      name: 'apps-{{path.basename}}'
      namespace: argocd
    spec:
      destination:
        namespace: apps-{{path.basename}}
        server: https://kubernetes.default.svc
      project: default
      source:
        path: '{{path}}'
        repoURL: https://github.com/LilithPandragon/dritte-einheit
        targetRevision: HEAD
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
