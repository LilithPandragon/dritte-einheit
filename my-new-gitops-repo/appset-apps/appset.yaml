apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  generators:
  - git:
      repoURL: https://github.com/LilithPandragon/my-new-gitops-repo
      revision: HEAD
      directories:
      - path: "appset-apps/*"




  destination:
    namespace: podinfo
    server: https://kubernetes.default.svc
  project: default
  source:
    path: apps/podinfo
    repoURL: https://github.com/LilithPandragon/my-new-gitops-repo
    targetRevision: HEAD
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true         
